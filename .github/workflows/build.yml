name: Build

on:
  push:
    branches: [main]
    paths:
      - source/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    paths:
      - source/**
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    uses: ./.github/workflows/resolve.yml

  deps:
    needs: resolve
    uses: ./.github/workflows/deps.yml
    with:
      commits: ${{ needs.resolve.outputs.commits }}
      emsdk-version: latest
      rust-toolchain: "1.91"
      rust-nightly: nightly-2026-10-01

  godot:
    needs: [resolve, deps]
    uses: ./.github/workflows/godot.yml
    with:
      commits: ${{ needs.resolve.outputs.commits }}
      emsdk-version: latest

  demos:
    needs: [resolve, godot]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/demos.yml
    with:
      commits: ${{ needs.resolve.outputs.commits }}

  release:
    needs: [resolve, godot]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      commits: ${{ needs.resolve.outputs.commits }}
