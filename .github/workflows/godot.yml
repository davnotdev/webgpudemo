name: Godot

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      commits:
        type: string
        required: true
      emsdk-version:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  godot:
    name: godot (${{ inputs.platform }}, ${{ matrix.buildtype }}, ${{ matrix.backend }})
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
        backend: ${{ fromJSON(inputs.platform == 'web' && '["emdawnwebgpu"]' || '["wgpu-desktop", "dawn-desktop"]') }}
    env:
      GODOT_SHA: ${{ fromJSON(inputs.commits).godot }}
      BACKEND_DEP: ${{ matrix.backend == 'wgpu-desktop' && 'wgpu-native' || matrix.backend == 'dawn-desktop' && 'dawn' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          repository: davnotdev/godot
          ref: ${{ env.GODOT_SHA }}
          path: godot

      - uses: actions/download-artifact@v4
        with:
          name: dep-naga-${{ inputs.platform }}-${{ matrix.buildtype }}
          path: godot

      - uses: actions/download-artifact@v4
        with:
          name: dep-spirv-webgpu-transform-${{ inputs.platform }}-${{ matrix.buildtype }}
          path: godot

      - if: env.BACKEND_DEP != ''
        uses: actions/download-artifact@v4
        with:
          name: dep-${{ env.BACKEND_DEP }}-${{ inputs.platform }}-${{ matrix.buildtype }}
          path: godot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m pip install scons

      - if: inputs.platform == 'linuxbsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev \
            libxrandr-dev libwayland-dev

      - if: inputs.platform == 'web'
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: ${{ inputs.emsdk-version }}

      - uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ inputs.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}-${{ env.GODOT_SHA }}
          restore-keys: scons-${{ inputs.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}-

      - env:
          PLATFORM: ${{ inputs.platform }}
          BUILDTYPE: ${{ matrix.buildtype }}
          BACKEND: ${{ matrix.backend }}
        run: |
          cd godot
          bash ../ci/scripts/build-godot.sh "cache_path=${{ github.workspace }}/.scons-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ inputs.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}
          path: godot/bin/${{ inputs.platform == 'windows' && '*.exe' || inputs.platform == 'web' && '*.zip' || 'godot.linuxbsd.*' }}
          if-no-files-found: error

      - if: inputs.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ inputs.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}-pdb
          path: godot/bin/*.pdb
          if-no-files-found: warn
