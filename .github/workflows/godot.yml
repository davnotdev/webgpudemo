name: Godot

on:
  workflow_call:
    inputs:
      commits:
        type: string
        required: true
      emsdk-version:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  godot:
    name: godot (${{ matrix.platform }}, ${{ matrix.buildtype }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linuxbsd, windows, web]
        buildtype: [debug, release]
        backend: [wgpu-desktop, dawn-desktop, emdawnwebgpu]
        exclude:
          - platform: linuxbsd
            backend: emdawnwebgpu
          - platform: windows
            backend: emdawnwebgpu
          - platform: web
            backend: wgpu-desktop
          - platform: web
            backend: dawn-desktop
        include:
          - platform: linuxbsd
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: web
            os: ubuntu-latest
          - backend: wgpu-desktop
            backend-dep: wgpu-native
          - backend: dawn-desktop
            backend-dep: dawn
    env:
      GODOT_SHA: ${{ fromJSON(inputs.commits).godot }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - uses: actions/checkout@v4
        with:
          repository: davnotdev/godot
          ref: ${{ env.GODOT_SHA }}
          path: godot

      - uses: actions/download-artifact@v4
        with:
          name: dep-naga-${{ matrix.platform }}-${{ matrix.buildtype }}
          path: godot

      - uses: actions/download-artifact@v4
        with:
          name: dep-spirv-webgpu-transform-${{ matrix.platform }}-${{ matrix.buildtype }}
          path: godot

      - if: matrix.backend-dep
        uses: actions/download-artifact@v4
        with:
          name: dep-${{ matrix.backend-dep }}-${{ matrix.platform }}-${{ matrix.buildtype }}
          path: godot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m pip install scons

      - if: matrix.platform == 'linuxbsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev \
            libxrandr-dev libwayland-dev

      - if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: ${{ inputs.emsdk-version }}

      - uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}-${{ env.GODOT_SHA }}
          restore-keys: scons-${{ matrix.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}-

      - env:
          PLATFORM: ${{ matrix.platform }}
          BUILDTYPE: ${{ matrix.buildtype }}
          BACKEND: ${{ matrix.backend }}
        run: |
          cd godot
          bash ../ci/scripts/build-godot.sh "cache_path=${{ github.workspace }}/.scons-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.platform }}-${{ matrix.buildtype }}-${{ matrix.backend }}
          path: godot/bin
          if-no-files-found: error
