name: Lint Schemas

on:
  push:
    paths:
      - schemas/**
      - source/**
      - scripts/lint-schemas.py
      - .github/workflows/lint-schemas.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m pip install jsonschema pyyaml

      - run: python scripts/lint-schemas.py
