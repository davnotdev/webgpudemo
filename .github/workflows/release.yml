name: Release

on:
  workflow_call:
    inputs:
      commits:
        type: string
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: godot-*
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: demos-*-release
          path: demos

      - env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ inputs.commits }}
        run: |
          mkdir assets
          for dir in dist/*/; do
            name=$(basename "$dir")
            if [[ $name == godot-web-* ]]; then
              cp "$dir"*.zip assets/
            else
              (cd "$dir" && zip -qr "../../assets/$name.zip" .)
            fi
          done

          for renderer in mobile forward_plus; do
            dir="demos/demos-$renderer-release"
            [ -d "$dir" ] || continue
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/assets/godot-demo-projects-$renderer-release.zip" .) &
            zip_pids+=("$!")
          done
          zip_status=0
          for pid in "${zip_pids[@]}"; do
            wait "$pid" || zip_status=$?
          done
          [ "$zip_status" -eq 0 ]

          godot=$(jq -r '.godot' <<< "$COMMITS")
          tag="godot-webgpu-${godot:0:10}-${{ github.run_number }}"

          gh release create "$tag" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes ""
